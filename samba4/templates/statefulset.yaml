apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "samba4.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "samba4.name" . }}
    helm.sh/chart: {{ include "samba4.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
spec:
  replicas: {{ .Values.pod.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "samba4.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "samba4.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
    spec:
    {{- with .Values.pod.securityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
    {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.pod.image.repository }}:{{ .Values.pod.image.tag }}"
          imagePullPolicy: {{ .Values.pod.image.pullPolicy }}
          ports:
            - name: cifs
              containerPort: 445
              protocol: TCP
{{- if .Values.pod.livenessProbe.enabled | default true }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - {{ .Values.pod.livenessProbe.command | default "echo | smbclient -L 127.0.0.1 -m SMB3" | quote }}
{{- end }}
          readinessProbe:
            tcpSocket:
              port: cifs
          resources:
            {{- toYaml .Values.pod.resources | nindent 12 }}
          volumeMounts:
          {{- with .Values.pod.volumeMounts }}
{{ toYaml . | indent 10 }}
          {{- end }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- with .Values.pod.volumes }}
{{ toYaml . | indent 6 }}
      {{- end }}
  volumeClaimTemplates:
  {{- with .Values.pod.volumeClaimTemplates }}
{{ toYaml . | indent 2 }}
  {{- end }}
