apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "samba4.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "samba4.name" . }}
    helm.sh/chart: {{ include "samba4.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
spec:
  replicas: {{ .Values.pod.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "samba4.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "samba4.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
    spec:
{{- with .Values.pod.securityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.pod.image.repository }}:{{ .Values.pod.image.tag }}"
          imagePullPolicy: {{ .Values.pod.image.pullPolicy }}
          ports:
            - name: cifs
              containerPort: 445
              protocol: TCP
{{- if .Values.pod.livenessProbe.enabled | default true }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - {{ .Values.pod.livenessProbe.command | default "echo | smbclient -L 127.0.0.1 -m SMB3" | quote }}
{{- end }}
          readinessProbe:
            tcpSocket:
              port: cifs
          resources:
            {{- toYaml .Values.pod.resources | nindent 12 }}
          volumeMounts:
{{- if .Values.pod.useExistingSmbConfigmap }}
          - mountPath: /etc/samba/smb.conf
            name: smbconf
            subPath: smb.conf
{{- end }}
{{- if .Values.pod.useExistingUsersSecret }}
          - mountPath: /etc/samba/users.conf
            name: users
            subPath: users.conf
{{- end }}
{{- if not .Values.pod.persistence.enabled }}
          - mountPath: /storage
            name: storage
{{- end }}
{{- if .Values.pod.persistence.enabled -}}
{{- if eq .Values.pod.persistence.type "pvcs" }}
{{- if .Values.pod.persistence.pvcs }}
{{- range .Values.pod.persistence.pvcs }}
          - mountPath: {{ .mountPath }}
            name: {{ .name }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
{{- if .Values.pod.useExistingSmbConfigmap }}
      - name: smbconf
        configMap:
          name: {{ .Values.pod.ExistingSmbConfigmap }}
          defaultMode: 0644
{{- end }}
{{- if .Values.pod.useExistingUsersSecret }}
      - name: users
        secret:
          secretName: {{ .Values.pod.ExistingUsersSecret }}
          defaultMode: 0600
{{- end }}
{{- if not .Values.pod.persistence.enabled }}
      - name: storage
        emptyDir: {}
{{- end }}
{{- if .Values.pod.persistence.enabled -}}
{{-   if eq .Values.pod.persistence.type "pvcs" -}}
{{-     if .Values.pod.persistence.pvcs }}
  volumeClaimTemplates:
{{-       range .Values.pod.persistence.pvcs }}
  - metadata:
      name: {{ .name }}
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .size }}
      storageClassName: {{ .storageClassName | default "" | quote }} 
{{-       end }}
{{-     end }}
{{    end -}}
{{ end }}
